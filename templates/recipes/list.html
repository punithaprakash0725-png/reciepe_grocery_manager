{% extends "base.html" %}{% block content %}<div class="heading-row"><h1>Recipe Vault</h1>{% if user.is_authenticated %}<a class="button" href="{% url 'add_recipe' %}">+ Add recipe</a>{% endif %}</div><div class="cards">{% for recipe in recipes %}<a class="card" href="{% url 'recipe_detail' recipe.pk %}"><span class="tag">{{ recipe.category }}</span><h3>{{ recipe.title }}</h3><p>{{ recipe.cooking_time }} minutes</p></a>{% empty %}<p>No approved recipes available yet.</p>{% endfor %}</div>{% endblock %}
